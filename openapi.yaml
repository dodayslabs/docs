openapi: 3.1.0
info:
  title: DoDays API
  version: "1.0"
  description: The DoDays API reference.
  contact:
    name: DoDays Engineering
    email: engineering@dodays.co.uk
  license:
    name: Proprietary
    identifier: Proprietary
servers:
  - description: Production
    url: "https://api.dodays.co.uk/v1"
  - description: Staging
    url: "https://api.dodays-staging.co.uk/v1"
  - description: Local
    url: "http://api.dodays.test/v1"
paths:
  /abilities:
    parameters: []
    get:
      operationId: get-abilities
      summary: List abilities
      description: Retrieve a list of abilities.
      responses:
        "200":
          description: Returns a list of abilities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  "1":
                    type: string
                  "2":
                    type: string
                  "3":
                    type: string
              examples:
                Example 1:
                  value:
                    "1": Beginner
                    "2": Intermediate
                    "3": Advanced
      x-internal: false
      security: []
      tags:
        - Abilities
  /account/details:
    parameters: []
    patch:
      summary: Update details
      operationId: patch-details
      responses:
        "200":
          $ref: "#/components/responses/User"
      description: Update the account holders details.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                telephone:
                  type: string
                street:
                  type: string
                town:
                  type: string
                region:
                  type: string
                postcode:
                  type: string
                medical:
                  type: string
              required:
                - first_name
                - last_name
                - email
                - telephone
            examples:
              Example 1:
                value:
                  first_name: DoDays
                  last_name: User
                  email: user@dodays.co.uk
                  telephone: "01912345678"
                  street: 1 User Street
                  town: User Town
                  region: User
                  postcode: BR0WN
                  medical: Some medical information
        description: Updates the users account.
      tags:
        - Account
  /account/emergency-contact:
    parameters: []
    patch:
      summary: Update emergency contact
      operationId: patch-emergency-contact
      responses:
        "200":
          $ref: "#/components/responses/User"
      description: Update the account holders emergency contact.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                telephone:
                  type: string
                relationship:
                  type: string
            examples:
              Example 1:
                value:
                  name: DoDays Emergency
                  telephone: "01912345679"
                  relationship: emergency@dodays.co.uk
        description: Updates the users emergency contact.
      tags:
        - Account
  /account/password:
    parameters: []
    patch:
      summary: Update password
      operationId: patch-password
      responses:
        "200":
          $ref: "#/components/responses/User"
      description: Update the account password.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                new_password_confirmation:
                  type: string
              required:
                - current_password
                - new_password
                - new_password_confirmation
            examples:
              Example 1:
                value:
                  current_password: password
                  new_password: new-password
                  new_password_confirmation: new-password
        description: Updates the users password.
      x-internal: false
      tags:
        - Account
  /account/attach-payment-method:
    parameters: []
    post:
      summary: Attach Payment Method
      operationId: post-attach-payment-method
      responses:
        "204":
          description: No content.
      tags:
        - Account
      description: Attach a payment method to the user.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                provider_id:
                  type: integer
                payment_method:
                  type: string
              required:
                - provider_id
                - payment_method
            examples:
              Example 1:
                value:
                  provider_id: 1
                  payment_method: card
        description: Attaches a new payment method to the authenticated user for a given provider.
  /account/marketing-consent:
    parameters: []
    patch:
      summary: Update marketing consent
      operationId: patch-marketing-consent
      responses:
        "204":
          description: No content.
      description: Update the account holders marketing consent.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                provider_id:
                  type: integer
              required:
                - provider_id
            examples:
              Example 1:
                value:
                  provider_id: 1
        description: Toggles the users marketing consent for a given provider.
      x-internal: false
      tags:
        - Account
  /account/photo-consent:
    parameters: []
    patch:
      summary: Update photo consent
      operationId: patch-photo-consent
      responses:
        "204":
          description: No content.
      description: Update the account holders photo consent.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                provider_id:
                  type: integer
              required:
                - provider_id
            examples:
              Example 1:
                value:
                  provider_id: 1
        description: Toggles the users photo consent for a given provider.
      x-internal: false
      tags:
        - Account
  /account/session-reminders:
    parameters: []
    patch:
      summary: Update session reminders
      operationId: patch-session-reminders
      responses:
        "204":
          description: No content.
      description: Update the account holders session reminders.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                provider_id:
                  type: integer
              required:
                - provider_id
            examples:
              Example 1:
                value:
                  provider_id: 1
        description: Toggles the users session reminders setting for a given provider.
      x-internal: false
      tags:
        - Account
  /activities:
    parameters: []
    get:
      summary: List activities
      operationId: get-activities
      responses:
        "200":
          description: Returns a list of activities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  "1":
                    type: string
                  "2":
                    type: string
                  "3":
                    type: string
              examples:
                Example 1:
                  value:
                    "1": Swimming
                    "2": Yoga
                    "3": Cookery
      description: Retrieve a list of activities.
      x-internal: false
      security: []
      tags:
        - Activities
  /whoami:
    parameters: []
    get:
      summary: Whoami
      operationId: get-whoami
      responses:
        "200":
          $ref: "#/components/responses/User"
      description: Retrieve the authenticated user.
      tags:
        - Auth
  /auth/register:
    parameters: []
    post:
      summary: Register a user
      operationId: post-register
      responses:
        "201":
          $ref: "#/components/responses/Token"
      description: Register and retrieve a token.
      security: []
      tags:
        - Auth
      requestBody:
        $ref: "#/components/requestBodies/Register"
  /auth/token:
    parameters: []
    post:
      summary: Get a token
      operationId: post-token
      responses:
        "200":
          $ref: "#/components/responses/Token"
      description: Sign in and retrieve a token.
      security: []
      tags:
        - Auth
      requestBody:
        $ref: "#/components/requestBodies/Token"
  /auth/forgot-password:
    parameters: []
    post:
      summary: Password reset link
      operationId: post-forgot-password
      responses:
        "200":
          $ref: "#/components/responses/Status"
      description: Request a password reset link.
      security: []
      tags:
        - Auth
      requestBody:
        $ref: "#/components/requestBodies/ForgotPassword"
  /auth/reset-password:
    parameters: []
    post:
      summary: Reset password
      operationId: post-reset-password
      responses:
        "200":
          $ref: "#/components/responses/Status"
      description: Reset the users password.
      security: []
      tags:
        - Auth
      requestBody:
        $ref: "#/components/requestBodies/ResetPassword"
  /booking-sessions:
    parameters: []
    get:
      summary: List booking sessions
      operationId: get-booking-sessions
      responses:
        "200":
          description: Returns a list of Booking Session objects.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BookingSession"
      description: Retrieve a list of booking sessions.
      parameters:
        - schema:
            type: integer
          in: query
          name: "filter[provider]"
          description: ID of the provider
        - schema:
            type: integer
          in: query
          name: "filter[student]"
          description: ID of the student
        - schema:
            type: boolean
          in: query
          name: "filter[banked]"
          description: Whether the booking session has been banked
      tags:
        - Booking Sessions
  "/booking-sessions/{bookingSessionId}/bank":
    parameters:
      - schema:
          type: string
        name: bookingSessionId
        in: path
        required: true
    post:
      operationId: post-bank-booking-session
      summary: Bank booking session
      description: Bank a booking session.
      responses:
        "204":
          description: No content.
      x-internal: false
      tags:
        - Booking Sessions
  /bookings:
    parameters: []
    post:
      summary: Create a booking
      operationId: post-booking
      responses:
        "201":
          description: Booking created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Booking"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                class_id:
                  type: integer
                sessions:
                  type: array
                  items:
                    type: integer
                students:
                  type: array
                  items:
                    type: integer
                price_id:
                  type: integer
                plan_id:
                  type: integer
                discount_id:
                  type: integer
                voucher_id:
                  type: integer
                payment_amount:
                  type: integer
                voucher_amount:
                  type: integer
                credit_amount:
                  type: integer
                payment_intent:
                  type: string
                payment_method:
                  type: string
                save_payment_method:
                  type: boolean
                invite_code:
                  type: string
                terms:
                  type: boolean
                loco_parentis:
                  type: boolean
                marketing_consent:
                  type: boolean
                photo_consent:
                  type: boolean
                referral:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - friend
                        - wordOfMouth
                        - searchEngine
                        - facebook
                        - twitter
                        - instagram
                        - clubHub
                        - whatsOn4Kids
                        - netmums
                        - leaflet
                        - tvRadio
                        - event
                        - other
                    name:
                      type: string
                emergency:
                  type: object
                  properties:
                    name:
                      type: string
                    telephone:
                      type: string
        description: Creates a new booking.
      description: Create a new booking.
      x-internal: false
      tags:
        - Bookings
    get:
      operationId: get-bookings
      summary: List bookings
      description: Retrieve a list of bookings.
      parameters:
        - schema:
            type: integer
          in: query
          name: "filter[provider]"
          description: ID of the provider
        - schema:
            type: integer
          in: query
          name: "filter[student]"
          description: ID of the student
        - schema:
            type: boolean
          in: query
          name: "filter[ended]"
          description: Whether the booking has ended
        - schema:
            type: string
          in: query
          name: include
          description: Related resources to include
      responses:
        "200":
          description: Returns a list of Booking objects.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Booking"
      tags:
        - Bookings
  /bookings/calculate:
    parameters: []
    get:
      summary: Calculate booking costs
      operationId: get-booking-calculation
      responses:
        "200":
          description: Returns the calculated booking costs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking_net:
                    type: integer
                  booking_discount:
                    type: integer
                  booking_fee:
                    type: integer
                  booking_gross:
                    type: integer
                  subscription_net:
                    type: integer
                  subscription_discount:
                    type: integer
                  subscription_fee:
                    type: integer
                  subscription_gross:
                    type: integer
                  subscription_upfront_net:
                    type: integer
                  subscription_upfront_discount:
                    type: integer
                  subscription_upfront_fee:
                    type: integer
                  subscription_upfront_gross:
                    type: integer
                  voucher_amount:
                    type: integer
                  credit_amount:
                    type: integer
                  amount_due:
                    type: integer
                  payment_intent_amount:
                    type: integer
                  force_absorb:
                    type: boolean
      description: Retrieve the Booking costs.
      parameters:
        - schema:
            type: integer
          in: query
          name: "filter[class]"
          description: ID of the class
          required: true
        - schema:
            type: array
            items:
              type: integer
          in: query
          name: "filter[sessions][]"
          description: IDs of the sessions
          required: true
        - schema:
            type: array
            items:
              type: integer
          in: query
          name: "filter[students][]"
          description: IDs of the students
          required: true
        - schema:
            type: integer
          in: query
          name: "filter[price]"
          description: ID of the price
          required: true
        - schema:
            type: integer
          in: query
          name: "filter[plan]"
          description: ID of the plan
        - schema:
            type: integer
          in: query
          name: "filter[discount]"
          description: ID of the discount
        - schema:
            type: integer
          in: query
          name: "filter[voucher]"
          description: ID of the voucher
      tags:
        - Bookings
  "/bookings/{bookingRef}":
    parameters:
      - schema:
          type: string
        name: bookingRef
        in: path
        required: true
    get:
      summary: Get a booking
      responses:
        "200":
          description: Returns the Booking object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Booking"
        "404":
          description: Booking not found.
      operationId: get-booking
      description: Retrieve the booking.
      tags:
        - Bookings
  "/bookings/{bookingRef}/pay":
    parameters:
      - schema:
          type: string
        name: bookingRef
        in: path
        required: true
    post:
      summary: Pay booking
      operationId: post-pay-booking
      responses:
        "204":
          description: No content.
      description: Pay a booking.
      tags:
        - Bookings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_intent:
                  type: string
                credit_amount:
                  type: integer
        description: Pays for a booking.
  /available-catch-up-sessions:
    parameters: []
    get:
      operationId: get-available-catch-up-sessions
      summary: List catch-up sessions
      description: Retrieve a list of available catch-up sessions.
      responses:
        "200":
          description: Returns a list of Session objects.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
      parameters:
        - schema:
            type: integer
          in: query
          name: "filter[banked_session]"
          description: ID of the banked booking session
        - schema:
            type: string
          in: query
          name: include
          description: Related resources to include
      tags:
        - Catch-ups
  /catch-ups:
    parameters: []
    post:
      summary: Book catch-up
      operationId: post-book-catch-up
      description: Book a catch-up session.
      responses:
        "201":
          description: Catch-up session created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Booking"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                banked_session_id:
                  type: integer
                session_id:
                  type: integer
        description: Books a booking session.
      x-internal: false
      tags:
        - Catch-ups
  /classes:
    parameters: []
    get:
      summary: List classes
      operationId: get-classes
      description: Retrieve a list of classes.
      responses:
        "200":
          description: Returns a list of Class objects.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Class"
                  links:
                    $ref: "#/components/schemas/PaginationLinks"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
      parameters:
        - schema:
            type: integer
          in: query
          name: "filter[provider]"
          description: ID of the provider
        - schema:
            type: integer
            format: date
          in: query
          name: "filter[term]"
          description: ID of the term
        - schema:
            type: integer
          in: query
          name: "filter[venue]"
          description: ID of the venue
        - schema:
            type: integer
          in: query
          name: "filter[stage]"
          description: ID of the stage
        - schema:
            type: number
          in: query
          name: "filter[latitude]"
          description: Current location latitude
        - schema:
            type: number
          in: query
          name: "filter[longitude]"
          description: Current location longitude
        - schema:
            type: string
          in: query
          name: "filter[age][interval]"
          description: "Interval between the min and max age i.e. month, year"
        - schema:
            type: integer
          in: query
          name: "filter[age][min]"
          description: Minimum age threshold
        - schema:
            type: integer
          in: query
          name: "filter[age][max]"
          description: Maximum age threshold
        - schema:
            type: integer
          in: query
          name: "filter[ability]"
          description: ID of the ability
        - schema:
            type: integer
          in: query
          name: "filter[activity]"
          description: ID of the activity
        - schema:
            type: string
          in: query
          name: "filter[day]"
          description: "Numerical day of the week i.e. 1 = Sunday, 2 = Monday etc."
        - schema:
            type: string
          in: query
          name: "filter[search]"
          description: "Phrase to match the class name, venue name and provider name"
        - schema:
            type: integer
          in: query
          name: page
          description: Pagination page number
        - schema:
            type: integer
          in: query
          name: limit
          description: Pagination page limit
      security: []
      tags:
        - Classes
  "/classes/{classId}":
    parameters:
      - schema:
          type: string
        name: classId
        in: path
        required: true
    get:
      summary: Get a class
      responses:
        "200":
          description: Returns a Class object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Class"
        "404":
          description: Class not found.
      operationId: get-class
      description: Retrieve the class.
      x-internal: false
      tags:
        - Classes
      security: []
  /class-costs:
    parameters: []
    get:
      summary: List class costs
      operationId: get-class-costs
      responses:
        "200":
          description: "Returns a list of session costs, in pence format, associated to the classes in the given term."
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
      description: Retrieve a list of class costs.
      x-internal: false
      parameters:
        - schema:
            type: integer
          in: query
          name: "filter[term]"
          description: ID of the term
      security: []
      tags:
        - Classes
  /coupons/apply:
    parameters: []
    post:
      summary: Apply coupon
      operationId: post-apply-coupon
      responses:
        "200":
          description: Returns a Discount or Voucher object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/Discount"
                      - $ref: "#/components/schemas/Voucher"
                  meta:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - discount
                          - voucher
              examples: {}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                class:
                  type: integer
                code:
                  type: string
        description: Applies a Discount or Voucher to the booking.
      description: Apply a Discount or Voucher.
      tags:
        - Coupons
  /days:
    parameters: []
    get:
      summary: List days
      operationId: get-days
      responses:
        "200":
          description: Returns a list of days the provider delivers classes.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                Example 1:
                  value:
                    - Monday
                    - Wednesday
      description: Retrieve a list of days.
      x-internal: false
      parameters:
        - schema:
            type: integer
          in: query
          name: "filter[provider]"
          description: ID of the provider
      security: []
      tags:
        - Days
  /discover:
    parameters: []
    get:
      operationId: get-discover
      summary: Discover providers or activities
      description: Retrieve a list of providers or activities.
      tags:
        - Discover
      parameters:
        - schema:
            type: string
            enum:
              - provider
              - activity
          in: query
          name: "filter[type]"
          description: Type of discovery
          required: true
        - schema:
            type: array
            items:
              $ref: "#/components/schemas/Category"
          in: query
          name: "filter[categories][]"
          description: Category functions
        - schema:
            type: array
            items:
              $ref: "#/components/schemas/Type"
          in: query
          name: "filter[types][]"
          description: Type slugs
        - schema:
            type: number
          in: query
          name: "filter[latitude]"
          description: Current location latitude
          required: true
        - schema:
            type: number
          in: query
          name: "filter[longitude]"
          description: Current location longitude
          required: true
        - schema:
            type: number
          in: query
          name: "filter[radius]"
          description: Current search radius in metres
        - schema:
            type: object
            properties:
              north:
                type: number
              south:
                type: number
              east:
                type: number
              west:
                type: number
          in: query
          name: "filter[bounds]"
          description: Viewport boundary
          style: deepObject
          explode: true
        - schema:
            type: string
          in: query
          name: filter[when]
          description: When activities are running
        - schema:
            type: string
            enum:
              - "distance"
              - "name"
              - "when"
          in: query
          name: sort
          description: Sort key
        - schema:
            type: integer
          in: query
          name: page
          description: Pagination page number
        - schema:
            type: integer
          in: query
          name: limit
          description: Pagination page limit
      responses:
        "200":
          description: |-
            Returns a list of Provider or Class objects based on the filter[type] parameter:
            - When filter[type]=provider, returns an array of Provider objects
            - When filter[type]=activity, returns an array of Class objects
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      oneOf:
                        - $ref: "#/components/schemas/ProviderWithType"
                        - $ref: "#/components/schemas/ClassWithType"
                      discriminator:
                        propertyName: type
                        mapping:
                          provider: "#/components/schemas/ProviderWithType"
                          activity: "#/components/schemas/ClassWithType"
                  links:
                    $ref: "#/components/schemas/PaginationLinks"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
  /links:
    parameters: []
    get:
      operationId: get-link
      summary: Get a link
      description: Retrieve a provider link.
      parameters:
        - schema:
            type: integer
          in: query
          name: "filter[provider]"
          description: ID of the provider
        - schema:
