        - id
        - ref
        - student_id
        - student_name
        - provider_id
        - provider_name
        - class_id
        - class_name
        - teacher_name
        - venue_name
        - net
        - gross
        - balance
      properties:
        id:
          type: integer
        ref:
          type: string
        student_id:
          type: integer
        student_name:
          type: string
        provider_id:
          type: integer
        provider_name:
          type: string
        class_id:
          type: integer
        class_name:
          type: string
        teacher_name:
          type: string
        venue_name:
          type: string
        net:
          type: integer
        gross:
          type: integer
        balance:
          type: integer
        credit:
          type: integer
        catch_up:
          type: boolean
        payment_method:
          type: string
          enum:
            - card
            - subscription
            - bank
            - bacs
