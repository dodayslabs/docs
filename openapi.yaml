  securitySchemes:
    Authorization:
      type: http
      scheme: bearer
  parameters: {}
  requestBodies:
    Register:
      content:
        application/json:
          schema:
            type: object
            properties:
              first_name:
                type: string
              last_name:
                type: string
              email:
                type: string
              password:
                type: string
              password_confirmation:
                type: string
              telephone:
                type: string
              terms:
                type: boolean
              device_name:
                type: string
            required:
              - first_name
              - last_name
              - email
              - password
              - password_confirmation
              - telephone
              - terms
              - device_name
          examples:
            Example 1:
              value:
                first_name: DoDays
                last_name: User
                email: user@dodays.co.uk
                password: password
                password_confirmation: password
                telephone: "01912345678"
                terms: true
                device_name: Device
      description: Creates and authenticates a new User and generates a new Token.
    Token:
      content:
        application/json:
          schema:
            type: object
            properties:
              email:
                type: string
              password:
                type: string
              device_name:
                type: string
            required:
              - email
              - password
              - device_name
          examples:
            Example 1:
              value:
                email: user@dodays.co.uk
                password: password
                device_name: Device
      description: Authenticates the User credentials and generates a new Token.
    ForgotPassword:
      content:
        application/json:
          schema:
            type: object
            properties:
              email:
                type: string
            required:
              - email
          examples:
            Example 1:
              value:
                email: user@dodays.co.uk
      description: Sends a new password reset email.
    ResetPassword:
      content:
        application/json:
          schema:
            type: object
            properties:
              token:
                type: string
              email:
                type: string
              password:
                type: string
              password_confirmation:
                type: string
            required:
              - token
              - email
              - password
              - password_confirmation
          examples:
            Example 1:
              value:
                token: abc123
                email: user@dodays.co.uk
                password: password
                password_confirmation: password
      description: Resets the User password.
  responses:
    Token:
      description: Returns a token string.
      content:
        application/json:
          schema:
            type: object
            properties:
              token:
                type: string
          examples:
            Example 1:
              value:
                token: 1|t0k3n
    User:
      description: Returns a User object.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: "#/components/schemas/User"
    Status:
      description: Returns a status string.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
          examples:
            Example 1:
              value:
                status: We have emailed your password reset link.
            Example 2:
              value:
                status: Your password has been reset.
